openapi: 3.0.3
info:
  title: Social Network API
  version: 1.0.0
  description: Demo API for login, refresh tokens, and reading posts.
servers:
  - url: http://127.0.0.1:5000
tags:
  - name: Authentication
  - name: Posts
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and obtain access/refresh tokens
      description: Public endpoint. Passwords are verified against stored password hashes. Login failures use a generic message.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  format: password
                  example: AliceDemo123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: Email or password is incorrect.
        '429':
          description: Too many login attempts (recommended for production; not implemented in this demo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for new tokens
      description: Requires a valid refresh JWT with auth:refresh. The presented refresh token is revoked after successful use.
      security:
        - refreshTokenAuth: []
      x-required-scopes: [auth:refresh]
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Missing, invalid, expired, wrong-type, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests (recommended for production; not implemented in this demo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
  /posts/{id}:
    get:
      tags: [Posts]
      summary: Get one post by ID
      description: Requires an access token with posts:read. Private posts are only visible to their author; inaccessible or unknown posts return 404.
      security:
        - accessTokenAuth: []
      x-required-scopes: [posts:read]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: post-001
      responses:
        '200':
          description: Post returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access token lacks posts:read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Post does not exist or is not visible to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests (recommended for production; not implemented in this demo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    accessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token. Required scope for GET /posts/{id}: posts:read."
    refreshTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Refresh token. Required scope for POST /auth/refresh: auth:refresh."
  schemas:
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        scope:
          type: string
          example: posts:read auth:refresh
    Post:
      type: object
      required: [id, author_id, title, content, visibility]
      properties:
        id:
          type: string
        author_id:
          type: string
        title:
          type: string
        content:
          type: string
        visibility:
          type: string
          enum: [public, private]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request body or parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
