
extends:
  - spectral:oas

rules:
  response-200-schema-not-empty:
    description: Response 200 must have a non-empty schema
    message: "Response 200 must contain a non-empty schema"
    severity: error
    given: "$.paths[*][*].responses['200']"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required:
            - content
          properties:
            content:
              type: object
              minProperties: 1
              additionalProperties:
                type: object
                required:
                  - schema
                properties:
                  schema:
                    type: object
                    minProperties: 1
