
extends:
  - spectral:oas

rules:
  response-200-schema-not-empty:
    description: Response 200 must have a non-empty schema.
    message: "Response 200 must define at least one schema property."
    severity: error
    given: "$.paths[*][*].responses['200'].content[*].schema"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          minProperties: 1
